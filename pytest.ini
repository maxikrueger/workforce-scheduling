[pytest]
# Pytest Konfiguration für Workforce Scheduling Tests

# Test-Verzeichnisse
testpaths = tests

# Python-Dateien für Tests
python_files = test_*.py

# Python-Klassen für Tests
python_classes = Test*

# Python-Funktionen für Tests
python_functions = test_*

# Marker
markers =
    slow: Markiert langsame Tests (dauern > 10 Sekunden)
    integration: Integration-Tests
    unit: Unit-Tests

# Optionen
# faulthandler aus: Die JVM (OptaPy/JPype) nutzt SIGSEGV intern, faulthandler
# würde das als Absturz behandeln und den Testlauf abbrechen
addopts =
    -v
    -p no:faulthandler
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage (optional, wenn pytest-cov installiert)
# addopts = --cov=. --cov-report=html --cov-report=term-missing
